name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      # DemoApplicationTests.contextLoads는 DB/JWT_SECRET이 없으면 스스로 건너뛴다.
      - run: ./mvnw -B test
        working-directory: yumm-server

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: yumm-web/package-lock.json
      - run: npm ci
        working-directory: yumm-web
      - run: npm run build
        working-directory: yumm-web
