# 필수 환경변수: JWT_SECRET, DB_URL, DB_USERNAME, DB_PASSWORD (미설정 시 기동 실패)
# 운영용 properties 설정(PostgreSQL)
# ./mvnw spring-boot:run -Dspring-boot.run.profiles=prod

spring.application.name=demo

# 서버 기본 설정
server.port=8080

# PostgreSQL 설정
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate 설정
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# 개발 중: update, 운영 시엔 validate 또는 none
spring.jpa.hibernate.ddl-auto=update   

# 로그 설정
logging.level.org.hibernate.SQL=debug

# API 문서(Swagger/OpenAPI)는 운영에서 닫는다.
# SecurityConfig가 /v3/api-docs/**·/swagger-ui/**를 permitAll로 열어 두므로,
# 켜져 있으면 비로그인 상태로 전체 API 스펙을 읽을 수 있다. 개발 프로파일에서는 그대로 켜져 있다.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
