spring.application.name=demo

# 서버 기본 설정
server.port=8080

# PostgreSQL 설정
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/demo_db}
spring.datasource.username=${DB_USERNAME:demo_user}
spring.datasource.password=${DB_PASSWORD:demo_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate 설정
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# 개발 중: update, 운영 시엔 validate 또는 none
spring.jpa.hibernate.ddl-auto=update   

# Redis 서버 연결 설정
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# (필요시 비밀번호 설정돼 있으면)
spring.data.redis.password=${REDIS_PASSWORD:}

# Swagger 자동 문서화 설정
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# JWT 설정
jwt.access-token-expiration = 36000000
jwt.refresh-token-expiration = 2592000000

