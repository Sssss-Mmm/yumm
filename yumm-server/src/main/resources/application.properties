spring.application.name=demo

# 서버 기본 설정
server.port=8080

# PostgreSQL 설정
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/demo_db}
spring.datasource.username=${DB_USERNAME:demo_user}
spring.datasource.password=${DB_PASSWORD:demo_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate 설정
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# 개발 중: update, 운영 시엔 validate 또는 none
spring.jpa.hibernate.ddl-auto=update   

# Redis 서버 연결 설정
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# (필요시 비밀번호 설정돼 있으면)
spring.data.redis.password=${REDIS_PASSWORD:}

# 메일(SMTP) 설정 - 알림 메일(FR-N-01)
# 값은 전부 OS 환경변수로 주입한다. 자격증명을 이 파일에 적지 않는다(NFR-05).
# SMTP_HOST가 비어 있으면(로컬 기본값) EmailServiceImpl이 발송을 건너뛴다.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# SMTP가 응답하지 않을 때 발송 스레드가 무한정 붙잡히지 않도록 5초에서 끊는다.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# 보내는 사람. 중계 서버 대부분이 인증 계정과 다른 From을 거부하므로 보통 SMTP_USERNAME과 같다.
app.mail.from=${SMTP_FROM:no-reply@yumm.local}

# Swagger 자동 문서화 설정
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# JWT 설정
jwt.access-token-expiration = 36000000
jwt.refresh-token-expiration = 2592000000

