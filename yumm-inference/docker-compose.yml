# teamProject/temp-inference/docker-compose.yml

version: '3.8' # Docker Compose 파일 형식 버전

services:
  # 이 서비스의 이름은 'inference'입니다.
  # 이 docker-compose.yml로 띄운 컨테이너 내에서 이 이름으로 서로 통신할 수 있습니다.
  # 하지만 이 파일은 temp-inference 서비스만 정의하므로, 다른 서비스와의 통신은 별도 고려가 필요합니다.
  inference:
    # 현재 디렉토리(.)의 Dockerfile을 사용하여 이미지를 빌드합니다.
    # Dockerfile은 teamProject/temp-inference/Dockerfile 에 있어야 합니다.
    build: .
    
    # 컨테이너의 8000번 포트를 호스트(로컬 PC)의 8001번 포트에 매핑합니다.
    # 이렇게 하면 로컬 PC에서 http://localhost:8001로 FastAPI 추론 서버에 접근할 수 있습니다.
    ports:
      - "8001:8000"
      
    # 컨테이너가 예기치 않게 종료되거나 Docker 데몬이 재시작될 때 항상 다시 시작하도록 설정합니다.
    restart: always
    
    # (선택 사항) 필요한 경우 볼륨을 마운트합니다.
    # 예를 들어, 추론에 사용될 모델 파일이나 로깅 데이터를 호스트와 공유해야 할 때 사용합니다.
    # volumes:
    #   - ./models:/app/models # 로컬의 'models' 폴더를 컨테이너의 '/app/models'에 마운트
    #   - ./logs:/app/logs     # 로컬의 'logs' 폴더를 컨테이너의 '/app/logs'에 마운트

    # (선택 사항) 환경 변수를 설정해야 하는 경우 (예: 민감한 정보가 아닌 설정값)
    # environment:
    #   - API_KEY=your_api_key_here
    #   - SOME_SETTING=value

    # (선택 사항) 컨테이너가 사용할 CPU/메모리 제한
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '0.5' # 0.5 코어 사용 제한
    #       memory: 2G # 2GB 메모리 사용 제한